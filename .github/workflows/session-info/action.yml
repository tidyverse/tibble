name: "Report the session info"
description: >
  Print `sessioninfo::session_info()` for every installed package.

  Five copies of these four lines were spread over three workflows, one of them
  already missing the guard that installs `sessioninfo` where the library does
  not have it yet.

runs:
  using: "composite"
  steps:
    - name: Session info
      run: |
        options(width = 100)
        if (!requireNamespace("sessioninfo", quietly = TRUE)) install.packages("sessioninfo")
        pkgs <- installed.packages()[, "Package"]
        sessioninfo::session_info(pkgs, include_base = TRUE)
      shell: Rscript {0}
