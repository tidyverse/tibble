name: "Point the driver at this runner's directories"
description: >
  Put the driver's directories on this runner's temp disk, and export them so
  every later step and container agrees on where things are.

inputs:
  not-cran-input:
    description: "The dispatched NOT_CRAN value."
    required: true

runs:
  using: "composite"
  steps:
    - name: "Point the driver at this runner's directories"
      id: main
      env:
        NOT_CRAN_INPUT: ${{ inputs.not-cran-input }}
      run: |
        mkdir -p "${RUNNER_TEMP}/tmp"
        {
          echo "NOT_CRAN=${NOT_CRAN_INPUT}"
          echo "PLAN=${RUNNER_TEMP}/plan/plan.json"
          echo "PKG_DIR=${RUNNER_TEMP}/pkg"
          echo "BASELINE_DIR=${RUNNER_TEMP}/baseline"
          echo "OUT_DIR=${RUNNER_TEMP}/results"
          echo "REVDEPX_IMAGE_FILE=${RUNNER_TEMP}/revdepx-image-ref"
          echo "REVDEPX_LIB_INDEX=${RUNNER_TEMP}/revdepx-lib-index.json"
          # The driver's own temp files; the checks get per-container /tmp
          # bind mounts under their work directories.
          echo "TMPDIR=${RUNNER_TEMP}/tmp"
          echo "TMP=${RUNNER_TEMP}/tmp"
          echo "TEMP=${RUNNER_TEMP}/tmp"
        } >> "${GITHUB_ENV}"
      shell: bash
