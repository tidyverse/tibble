name: "Actions to run for installing R packages"
inputs:
  token:
    description: GitHub token, set to secrets.GITHUB_TOKEN
    required: true
  r-version:
    description: Passed on to r-lib/actions/setup-r@v2
    required: false
    default: release
  install-r:
    description: Passed on to r-lib/actions/setup-r@v2
    required: false
    default: true
  needs:
    description: Passed on to r-lib/actions/setup-r-dependencies@v2
    required: false
    default: ""
  packages:
    description: Passed on to r-lib/actions/setup-r-dependencies@v2
    required: false
    default: deps::., any::sessioninfo
  extra-packages:
    description: Passed on to r-lib/actions/setup-r-dependencies@v2
    required: false
    default: any::rcmdcheck
  cache-version:
    description: Passed on to r-lib/actions/setup-r-dependencies@v2
    required: false
    default: 1

runs:
  using: "composite"
  steps:
    - name: Set environment variables
      run: |
        echo "R_REMOTES_NO_ERRORS_FROM_WARNINGS=true" | tee -a $GITHUB_ENV
        echo "R_KEEP_PKG_SOURCE=yes" | tee -a $GITHUB_ENV
        echo "_R_CHECK_SYSTEM_CLOCK_=false" | tee -a $GITHUB_ENV
        echo "_R_CHECK_FUTURE_FILE_TIMESTAMPS_=false" | tee -a $GITHUB_ENV
        # prevent rgl issues because no X11 display is available
        echo "RGL_USE_NULL=true" | tee -a $GITHUB_ENV
        # from https://github.com/r-devel/r-dev-web/blob/main/CRAN/QA/Kurt/lib/R/Scripts/check_CRAN_incoming.R
        echo "_R_CHECK_CRAN_INCOMING_CHECK_FILE_URIS_=true" | tee -a $GITHUB_ENV
        echo "_R_CHECK_CRAN_INCOMING_NOTE_GNU_MAKE_=true" | tee -a $GITHUB_ENV
        echo "_R_CHECK_PACKAGE_DEPENDS_IGNORE_MISSING_ENHANCES_=true" | tee -a $GITHUB_ENV
        echo "_R_CHECK_CODE_CLASS_IS_STRING_=true" | tee -a $GITHUB_ENV
        echo "_R_CHECK_CODOC_VARIABLES_IN_USAGES_=true" | tee -a $GITHUB_ENV
        echo "_R_CHECK_CONNECTIONS_LEFT_OPEN_=true" | tee -a $GITHUB_ENV
        echo "_R_CHECK_DATALIST_=true" | tee -a $GITHUB_ENV
        echo "_R_CHECK_NEWS_IN_PLAIN_TEXT_=true" | tee -a $GITHUB_ENV
        echo "_R_CHECK_PACKAGES_USED_CRAN_INCOMING_NOTES_=true" | tee -a $GITHUB_ENV
        echo "_R_CHECK_RD_CONTENTS_KEYWORDS_=true" | tee -a $GITHUB_ENV
        echo "_R_CHECK_R_DEPENDS_=warn" | tee -a $GITHUB_ENV
        echo "_R_CHECK_S3_METHODS_SHOW_POSSIBLE_ISSUES_=true" | tee -a $GITHUB_ENV
        echo "_R_CHECK_THINGS_IN_TEMP_DIR_=true" | tee -a $GITHUB_ENV
        echo "_R_CHECK_UNDOC_USE_ALL_NAMES_=true" | tee -a $GITHUB_ENV
        echo "_R_CHECK_URLS_SHOW_301_STATUS_=true" | tee -a $GITHUB_ENV
        echo "_R_CXX_USE_NO_REMAP_=true" | tee -a $GITHUB_ENV
        # There is no way to disable recency and frequency checks when the incoming checks are run
        # echo "_R_CHECK_CRAN_INCOMING_=true" | tee -a $GITHUB_ENV
        echo "_R_CHECK_CRAN_INCOMING_SKIP_LARGE_VERSION_=true" | tee -a $GITHUB_ENV
        echo "_R_CHECK_FORCE_SUGGESTS_=false" | tee -a $GITHUB_ENV
      shell: bash

    - name: Set environment variables (non-macOS only)
      if: runner.os != 'macOS'
      run: |
        echo "_R_CHECK_THINGS_IN_OTHER_DIRS_=true" | tee -a $GITHUB_ENV
      shell: bash

    - name: Set environment variables (non-Windows only)
      if: runner.os != 'Windows'
      run: |
        echo "_R_CHECK_BASHISMS_=true" | tee -a $GITHUB_ENV
      shell: bash

    - name: Review environment variables
      # Deliberately limited to the R-related variables this action sets.
      # A blanket `env | sort` also prints anything a caller happens to export;
      # log masking only covers values GitHub knows are secret, so a token that
      # was derived, decoded or assembled from parts would be printed in clear.
      run: |
        env | grep -E '^(_?R_|RGL_|CCACHE_|PKG_BUILD_)' | sort
      shell: bash

    - name: Update apt
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y aspell
        echo "_R_CHECK_CRAN_INCOMING_USE_ASPELL_=true" | tee -a $GITHUB_ENV
      shell: bash

    - name: Remove pkg-config@0.29.2
      if: runner.os == 'macOS'
      run: |
        brew uninstall pkg-config@0.29.2 || true
      shell: bash

    - uses: r-lib/actions/setup-pandoc@v2

    - name: Close the log group that setup-pandoc leaves open
      # `installPandocLinux()` in r-lib/actions/setup-pandoc writes
      # `::group::Download pandoc` and never writes the matching `::endgroup::`
      # (setup-pandoc/src/setup-pandoc.ts, the only `::group::` in that action),
      # so from there on the job log is one nesting level too deep. The log
      # viewer then swallows the heading of the step that follows: the entry for
      # `r-lib/actions/setup-r@v2` was missing entirely and its output was folded
      # into the collapsed setup-pandoc entry. Emitting the missing `::endgroup::`
      # restores the balance. This step is the one that gets swallowed instead,
      # which is why it does nothing but say so.
      # Fixed upstream by https://github.com/r-lib/actions/pull/1103; drop this
      # step, and its two copies in `revdep.yaml` and `revdep2.yaml`, once that
      # is merged and released in the `v2` tag.
      if: runner.os == 'Linux'
      run: |
        echo "::endgroup::"
      shell: bash

    - uses: r-lib/actions/setup-r@v2
      with:
        r-version: ${{ inputs.r-version }}
        install-r: ${{ inputs.install-r }}
        http-user-agent: ${{ matrix.config.http-user-agent }}
        use-public-rspm: true

    - name: Read `Config/gha/extra-packages` from DESCRIPTION
      id: get-extra
      uses: ./.github/workflows/get-extra

    - name: Let sudo keep R library env vars (ubuntu-26.04 forbids `sudo -E`)
      # r-lib/actions/setup-r-dependencies installs pak with
      #   sudo -E --preserve-env=PATH env R -e 'dir.create(Sys.getenv("R_LIB_FOR_PAK"), ...)'
      # From the ubuntu-26.04 runner image on, the sudoers policy rejects `-E`
      # ("sudo: preserving the entire environment is not supported, '-E' is
      # ignored"), so R_LIB_FOR_PAK is stripped and dir.create() aborts with a
      # zero-length 'path' argument. Whitelisting the R_* vars via env_keep
      # preserves them across sudo's env_reset even though blanket `-E` is
      # denied, without granting the setenv privilege.
      # Root cause is the ubuntu-26.04 image, still in public preview
      # (actions/runner-images#14226). No upstream r-lib/actions issue tracks the
      # `sudo -E` breakage yet -- one should be filed; drop this once fixed.
      if: runner.os == 'Linux'
      run: |
        sudo tee /etc/sudoers.d/r-lib-pak >/dev/null <<'EOF'
        Defaults env_keep += "R_LIB_FOR_PAK R_LIBS R_LIBS_USER R_LIBS_SITE MAKEFLAGS"
        EOF
        sudo chmod 0440 /etc/sudoers.d/r-lib-pak
      shell: bash

    - uses: r-lib/actions/setup-r-dependencies@v2
      env:
        GITHUB_PAT: ${{ inputs.token }}
      with:
        pak-version: stable
        needs: ${{ inputs.needs }}
        packages: ${{ inputs.packages }}
        extra-packages: ${{ inputs.extra-packages }} ${{ ( matrix.covr && 'r-lib/covr xml2' ) || '' }} ${{ steps.get-extra.outputs.packages }}
        cache-version: ${{ inputs.cache-version }}

    - name: Add pkg.lock to .gitignore
      run: |
        set -x
        if ! [ -f .github/.gitignore ] || [ -z "$(grep '^/pkg.lock$' .github/.gitignore)" ]; then
          echo /pkg.lock >> .github/.gitignore
        fi
      shell: bash

    - name: Add fake qpdf and checkbashisms
      if: runner.os == 'Linux'
      run: |
        sudo ln -s $(which true) /usr/local/bin/qpdf
        sudo ln -s $(which true) /usr/local/bin/checkbashisms
      shell: bash

    - name: Install ccache
      # https://github.com/hendrikmuhs/ccache-action/issues/437
      uses: hendrikmuhs/ccache-action@33522472633dbd32578e909b315f5ee43ba878ce # v1.2.22
      with:
        max-size: 10G
        verbose: 1
        save: false
        restore: false

    - name: Use ccache for compiling R code, and parallelize
      run: |
        mkdir -p ~/.R
        # Infer each compiler default for the active R version from R CMD config,
        # then route it through ccache. Reading the resolved defaults preserves the
        # standard flags R selects per version (e.g. -std=gnu2x for C, -std=gnu++17
        # / -std=gnu++20 for C++); a plain "CC = ccache gcc" override would drop
        # them and silently downgrade the standard across the version matrix.
        # Inference uses an empty user Makevars so we always read the pristine
        # Makeconf defaults, never a value we just wrote.
        # Note: the versioned switches (CXX11..CXX23) intentionally come out as
        # bare "g++" with no -std flag. R keeps the standard in a separate
        # CXXnnSTD variable (CXX17STD = -std=gnu++17, ...) and applies it on top
        # at compile time, so wrapping only CXXnn with ccache is correct and we
        # must NOT pin -std here ourselves.
        #
        # On Unix, ccache is attached through a generated one-word wrapper
        # command (ccache-gcc, ccache-g++, ...) rather than the more obvious
        # "CC = ccache gcc" prefix. R-devel briefly could not cope with a
        # compiler command of more than one word: tools:::ccE(), which backs the
        # "checking use of non-API entry points" check and therefore runs for
        # every package with compiled code, read R CMD config CC, kept only the
        # first word, and ran that. With "CC = ccache gcc" that left a bare
        # "ccache", and the check died with "ccache: invalid option -- 'E'".
        # https://github.com/r-devel/r-svn/commit/ca19f35240517186ed447e773ee67b55e207cf27
        # https://bugs.r-project.org/show_bug.cgi?id=19130
        # Upstream has since dropped the truncation again, so the prefix works
        # once more -- but it takes a while for that to reach the R-devel builds
        # CI installs, so the wrapper is still doing real work here. It stays
        # after that too: it costs nothing and is correct either way.
        #
        # Windows deliberately keeps the plain prefix, as a control group: it is
        # where a repeat of that upstream change would show up, while the Unix
        # jobs carry on regardless.
        ccache_bin="$(command -v ccache || true)"
        if [ -z "$ccache_bin" ]; then
          echo "::warning::ccache is not on the PATH, compiling without it."
        else
          wrapper_dir="$HOME/.R/ccache-wrappers"
          if [ "$RUNNER_OS" != "Windows" ]; then
            mkdir -p "$wrapper_dir"
          fi

          empty_makevars="$(mktemp)"
          for var in CC CXX CXX11 CXX14 CXX17 CXX20 CXX23; do
            val="$(R_MAKEVARS_USER="$empty_makevars" R CMD config "$var" 2>/dev/null || true)"
            if [ -z "$val" ]; then
              continue
            fi
            if [ "$RUNNER_OS" = "Windows" ]; then
              echo "$var = ccache $val" >> ~/.R/Makevars
              continue
            fi

            # Split "gcc -std=gnu2x" into the compiler and its flags: only the
            # compiler is wrapped, the flags are passed through unchanged.
            # ccache and the compiler are both found on the PATH at run time,
            # nothing is baked into the wrapper by path.
            prog="${val%%[[:space:]]*}"
            flags="${val#"$prog"}"
            wrapper="ccache-$(basename "$prog")"

            if [ ! -f "$wrapper_dir/$wrapper" ]; then
              printf '#!/bin/sh\nexec ccache %s "$@"\n' "$prog" > "$wrapper_dir/$wrapper"
              chmod +x "$wrapper_dir/$wrapper"
              # Never hand R a wrapper that has not been shown to work.
              if ! "$wrapper_dir/$wrapper" --version > /dev/null; then
                rm -f "$wrapper_dir/$wrapper"
                echo "::warning::No usable $wrapper, compiling $var without ccache."
              fi
            fi

            if [ -f "$wrapper_dir/$wrapper" ]; then
              echo "$var = $wrapper$flags" >> ~/.R/Makevars
            fi
          done
          rm -f "$empty_makevars"

          if [ "$RUNNER_OS" != "Windows" ]; then
            echo "$wrapper_dir" >> "$GITHUB_PATH"
            echo "===== ccache wrappers in $wrapper_dir ====="
            ls -l "$wrapper_dir"
            echo "==========================================="
          fi
        fi
        echo 'MAKEFLAGS = -j2' >> ~/.R/Makevars
        echo "===== generated ~/.R/Makevars ====="
        cat ~/.R/Makevars
        echo "==================================="

        # Compile on every core the runner has, not the two this used to pin.
        # Standard GitHub-hosted Linux runners have been 4-vCPU since 2024, so
        # -j2 left half the box idle through the phase that dominates a build:
        # measured on a 4-core box, 8 vendored unity objects with ccache
        # disabled take 70.8 s at -j2 and 43.1 s at -j4 -- 1.64x, at identical
        # user time. Peak RSS per unity object is ~834 MB, so four in flight is
        # ~3.3 GB of the runner's 16 GB.
        # detectCores() can return NA on exotic platforms; fall back to the old
        # value there. `--as-cran` sets _R_CHECK_LIMIT_CORES_, but that polices
        # the *package's* runtime parallelism, not compilation, so this is safe.
        ncores="$(Rscript --vanilla -e 'n <- parallel::detectCores(); cat(if (is.na(n) || n < 1) 2L else as.integer(n))')"
        echo "MAKEFLAGS = -j${ncores}" >> ~/.R/Makevars
        echo "===== generated ~/.R/Makevars ====="
        cat ~/.R/Makevars
        echo "==================================="

        echo 'CCACHE_SLOPPINESS=locale,time_macros' | tee -a $GITHUB_ENV

        # Do NOT export UserNM here, however tempting the `UserNM=true` trick
        # from AGENTS.md looks. It is a development shortcut, not a CI setting.
        #
        # R takes the nm program from $UserNM in
        # tools:::read_symbols_from_object_file, and that function serves two
        # callers, not one: building `symbols.rds` at install time (which
        # src/Makevars puts on the `all:` target), *and*
        # tools:::check_so_symbols scanning the built .so during `R CMD check`.
        # Pointing nm at `true` blinds the second one, so the check finds no
        # symbols at all and reports "Found no calls to 'R_registerRoutines',
        # 'R_useDynamicSymbols'" -- a NOTE, and with error_on = "note" a failed
        # check on a package that registers its routines perfectly well.
        #
        # It is not worth scoping to the installs either: measured, the sweep is
        # ~0.25 s per 90 MB of unstripped objects, so ~10-20 s for the whole
        # ~2.5 GB tree -- under 5% of a commit's floor, against a footgun that
        # silently weakens a CRAN check.

        # echo 'CCACHE_DEBUG=true' | tee -a $GITHUB_ENV
        # echo "CCACHE_DEBUGDIR=$(dirname $(pwd))/ccache-debug" | tee -a $GITHUB_ENV
        # mkdir -p $(dirname $(pwd))/.ccache-debug

        echo 'PKG_BUILD_EXTRA_FLAGS=false' | tee -a $GITHUB_ENV

        # Repair
        git rm -rf .ccache || true
        rm -rf .ccache
      shell: bash

    - name: Show R CMD config --all
      run: |
        R CMD config --all
      shell: bash
