name: "Action to deploy a pkgdown website"

runs:
  using: "composite"
  steps:
    - name: Deploy site
      uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
      with:
        timeout_minutes: 15
        max_attempts: 10
        command: |
          R -q -e 'pkgdown::deploy_to_branch(new_process = FALSE)'
