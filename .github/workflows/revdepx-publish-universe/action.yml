name: "Commit and push the universe image"
description: >
  Commit the universe container and push it, so the next run starts from it
  rather than rebuilding the library.

outputs:
  image:
    description: "The image reference that was published."
    value: ${{ steps.main.outputs.image }}
  pushed:
    description: "Whether the push happened."
    value: ${{ steps.main.outputs.pushed }}
  saved:
    description: "Whether the image was saved as an artifact instead."
    value: ${{ steps.main.outputs.saved }}

runs:
  using: "composite"
  steps:
    - name: "Commit and push the universe image"
      id: main
      run: |
        set -eu
        universe=$(printf '%s' "${{ steps.build-universe.outputs.universe }}")
        delta_gb=$(printf '%s' "${{ steps.precommit.outputs.delta_gb }}")
        delta_gb=${delta_gb:-0}
        delta_files=$(printf '%s' "${{ steps.precommit.outputs.delta_files }}")
        delta_files=${delta_files:-0}
        free_gb=$(df -BG --output=avail "${RUNNER_TEMP}" | tail -1 |
          tr -dc '0-9')
        free_inodes=$(df --output=iavail "${RUNNER_TEMP}" | tail -1 |
          tr -dc '0-9')
        echo "Universe delta: ${delta_gb}G in ${delta_files} files; free: ${free_gb}G, ${free_inodes} inodes"

        # Streamed from inside the step (see the build step for why).
        ./.github/workflows/revdepx/watch-resources.sh watch 60 "committing the universe image" &
        sampler=$!
        trap 'kill "${sampler}" 2> /dev/null || true' EXIT

        committed=false
        pushed=false
        saved=false
        if [ "${delta_gb}" -eq 0 ] \
          || [ "${free_gb}" -lt "$((delta_gb + 8))" ] \
          || [ "${free_inodes}" -lt "$((delta_files + 200000))" ]; then
          # An unmeasurable delta (0) no longer means "hope": after two
          # dead runners the burden of proof sits on the commit.
          echo "::warning::Not committing the universe image: the copy needs ${delta_gb}G and ${delta_files} inodes, and ${free_gb}G and ${free_inodes} inodes are free. The shards will build shard-local libraries instead."
        else
          # The watchdog, not the guard, is what protects the runner: when
          # disk, inodes or memory approach zero mid-commit it stops the
          # docker daemon -- aborting the daemon-side copy, which a killed
          # client would NOT abort -- then brings it back so the rest of
          # the job (report, artifact, cache save, logout) still works.
          (
            while sleep 20; do
              f=$(df -BG --output=avail "${RUNNER_TEMP}" 2> /dev/null |
                tail -1 | tr -dc '0-9') || break
              i=$(df --output=iavail "${RUNNER_TEMP}" 2> /dev/null |
                tail -1 | tr -dc '0-9') || break
              m=$(awk '/MemAvailable/ { print int($2 / 1048576) }' \
                /proc/meminfo 2> /dev/null) || break
              if [ "${f:-0}" -lt 4 ] || [ "${i:-999999}" -lt 100000 ] \
                || [ "${m:-99}" -lt 1 ]; then
                echo "::warning::Aborting the commit: ${f}G disk, ${i} inodes, ${m}G memory left -- stopping docker before the runner dies"
                sudo systemctl stop docker || true
                sleep 3
                sudo systemctl start docker || true
                break
              fi
            done
          ) &
          watchdog=$!
          if docker commit revdepx-universe-build "${universe}:run-${GITHUB_RUN_ID}"; then
            committed=true
          fi
          kill "${watchdog}" 2> /dev/null || true
          if [ "${committed}" = true ]; then
            # The rw layer just became an image layer; dropping the
            # container drops the original copy, so the disk peak subsides
            # before the push wants scratch space.
            docker rm revdepx-universe-build || true
            docker tag "${universe}:run-${GITHUB_RUN_ID}" "${universe}:latest"
            # --platform first: the containerd image store commits an OCI
            # manifest INDEX, and a plain push refuses it outright
            # ("trying to push a manifest list/index", run 32148999976).
            # Pushing the single platform manifest is what the error
            # itself prescribes; the plain push stays as the fallback for
            # a daemon whose push has no --platform flag.
            pushed=true
            docker push --platform linux/amd64 "${universe}:run-${GITHUB_RUN_ID}" \
              || docker push "${universe}:run-${GITHUB_RUN_ID}" \
              || pushed=false
          else
            echo "::warning::docker commit failed or was aborted; the shards will build shard-local libraries instead"
          fi
        fi

        if [ "${pushed}" = true ]; then
          docker push --platform linux/amd64 "${universe}:latest" \
            || docker push "${universe}:latest" || true
          echo "image=${universe}:run-${GITHUB_RUN_ID}" >> "${GITHUB_OUTPUT}"
        elif [ "${committed}" = true ]; then
          # No registry (permissions, outage): hand the image to the shards
          # as an artifact instead -- when the compressed save fits beside
          # what is already on the disk. When not even that fits, the
          # shards' local fallback carries the run.
          free_gb=$(df -BG --output=avail "${RUNNER_TEMP}" | tail -1 |
            tr -dc '0-9')
          if [ "${free_gb}" -ge "$((delta_gb / 2 + 8))" ]; then
            echo "::warning::Pushing to ${universe} failed; publishing the image as an artifact instead"
            mkdir -p "${RUNNER_TEMP}/universe-image"
            save_to="${RUNNER_TEMP}/universe-image/universe-image.tar.zst"
            # --platform for the same containerd-store reason as the push:
            # a plain save of a commit-created index once produced a
            # 1336-BYTE manifest-only tar, and every shard died loading
            # the empty shell it restored.
            if docker save --platform linux/amd64 \
              "${universe}:run-${GITHUB_RUN_ID}" 2> /dev/null |
              zstd -T0 -3 > "${save_to}" \
              || docker save "${universe}:run-${GITHUB_RUN_ID}" |
                zstd -T0 -3 > "${save_to}"; then
              # A universe image compresses to gigabytes; anything under
              # 100 MB is a manifest shell, not an image, and shipping it
              # costs every shard its run.
              if [ "$(stat -c %s "${save_to}" 2> /dev/null || echo 0)" -ge 104857600 ]; then
                saved=true
              else
                echo "::warning::docker save produced $(stat -c %s "${save_to}" 2> /dev/null || echo 0) bytes for a ${delta_gb}G image -- discarding the shell; the shards will build shard-local libraries instead"
                rm -f "${save_to}"
              fi
            else
              rm -f "${save_to}"
            fi
          else
            echo "::warning::Pushing to ${universe} failed, and ${free_gb}G free is too little to save the ${delta_gb}G image as an artifact; the shards will build shard-local libraries instead"
          fi
          echo "image=" >> "${GITHUB_OUTPUT}"
        else
          echo "image=" >> "${GITHUB_OUTPUT}"
        fi
        echo "pushed=${pushed}" >> "${GITHUB_OUTPUT}"
        echo "saved=${saved}" >> "${GITHUB_OUTPUT}"
        docker rm revdepx-universe-build 2> /dev/null || true
      shell: bash
