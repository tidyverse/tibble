name: "Record the state before the commit"
description: >
  Measure what the universe layer added, so the publish step can say whether the
  image is worth pushing.

outputs:
  delta_files:
    description: "How many files the layer added."
    value: ${{ steps.main.outputs.delta_files }}
  delta_gb:
    description: "How many gigabytes it added."
    value: ${{ steps.main.outputs.delta_gb }}

runs:
  using: "composite"
  steps:
    - name: "Record the state before the commit"
      id: main
      run: |
        set -eu
        out="${RUNNER_TEMP}/universe-out"
        mkdir -p "${out}"
        upper=$(docker inspect \
          --format '{{ .GraphDriver.Data.UpperDir }}' \
          revdepx-universe-build 2> /dev/null || true)
        delta_gb=""
        delta_files=""
        if [ -n "${upper}" ] && sudo test -d "${upper}"; then
          delta_gb=$(sudo du -s -BG "${upper}" 2> /dev/null | cut -f1 |
            tr -dc '0-9' || true)
          delta_files=$(sudo du -s --inodes "${upper}" 2> /dev/null |
            cut -f1 | tr -dc '0-9' || true)
        fi
        delta_gb=${delta_gb:-0}
        delta_files=${delta_files:-0}
        size_rw=""
        if [ "${delta_gb}" = "0" ]; then
          # The containerd image store leaves GraphDriver empty (run
          # 32114635495 measured "upper: <none>" and skipped a commit
          # that would have fit five times over), but docker itself can
          # still price the rw layer. The file count is not available
          # this way; the guard's fixed inode margin covers that.
          size_rw=$(docker ps -as --no-trunc \
            --filter name=revdepx-universe-build \
            --format '{{.Size}}' 2> /dev/null | head -1 |
            cut -d' ' -f1 || true)
          case "${size_rw}" in
            *TB)
              delta_gb=$(awk -v s="${size_rw%TB}" \
                'BEGIN { printf "%d", s * 1024 + 1 }' || echo 0)
              ;;
            *GB)
              delta_gb=$(awk -v s="${size_rw%GB}" \
                'BEGIN { printf "%d", s + 1 }' || echo 0)
              ;;
            *MB | *kB | *B)
              delta_gb=1
              ;;
          esac
          delta_gb=${delta_gb:-0}
        fi
        {
          echo "upper: ${upper:-<none>}"
          echo "size_rw: ${size_rw:-<not needed>}"
          echo "delta_gb: ${delta_gb}"
          echo "delta_files: ${delta_files}"
          echo "--- df -BG ---"
          df -BG || true
          echo "--- df -i ---"
          df -i || true
          echo "--- meminfo ---"
          grep -E 'MemTotal|MemAvailable|SwapTotal|SwapFree' /proc/meminfo || true
          echo "--- docker system df ---"
          docker system df || true
        } | tee "${out}/pre-commit-state.txt"
        echo "delta_gb=${delta_gb}" >> "${GITHUB_OUTPUT}"
        echo "delta_files=${delta_files}" >> "${GITHUB_OUTPUT}"
      shell: bash
