name: "Commit the revdep report to the checked ref"
description: >
  Stage whatever report files the run wrote under `revdep/`, and commit them to
  the branch the run was asked for.

  `revdep2` and `revdep4` each carried their own copy of these fifty-two lines.
  The copies had already drifted -- differently wrapped comments, and one word
  of the commit subject -- which is the whole argument for one of them.

  Does nothing, and says so, where the ref is not a branch of this repository,
  where the run wrote no report, or where the report is unchanged.

inputs:
  ref:
    description: >
      The ref the run was dispatched for. Empty means the ref the run is on,
      and then GitHub itself says whether that is a branch; given, only the
      remote can say, so it is looked up there.
    required: false
    default: ""
  workflow:
    description: "Names the workflow in the commit subject. Empty leaves it out."
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: Commit the report to the checked ref
      env:
        REF_INPUT: ${{ inputs.ref }}
        WORKFLOW: ${{ inputs.workflow }}
      run: |
        set -eu
        if [ -n "${WORKFLOW}" ]; then
          subject="chore: Update revdep report from ${WORKFLOW} run ${GITHUB_RUN_ID}"
        else
          subject="chore: Update revdep report from run ${GITHUB_RUN_ID}"
        fi
        # Without a `ref` input the dispatch decides, and GitHub says
        # outright what kind of ref it was; with one, only the remote can
        # say whether it names a branch. Anything else -- a tag, a SHA, a
        # branch that does not exist here -- has nowhere to put a commit.
        if [ -z "${REF_INPUT}" ]; then
          REF="${GITHUB_REF_NAME}"
          if [ "${GITHUB_REF_TYPE}" != "branch" ]; then
            echo "::notice::${REF} is a ${GITHUB_REF_TYPE}, not a branch; the report stays in the artifact only."
            exit 0
          fi
        else
          REF="${REF_INPUT}"
          if ! git ls-remote --exit-code --heads origin "${REF}" > /dev/null 2>&1; then
            echo "::notice::${REF} is not a branch of this repository; the report stays in the artifact only."
            exit 0
          fi
        fi
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        # Only what this run generated, and only what it managed to write:
        # a collector that fell back to the manifest-derived summary has a
        # README.md and no problems.md, which is a report, not an error.
        files=""
        for f in README.md problems.md failures.md cran.md manifest.json; do
          if [ -f "revdep/${f}" ]; then
            files="${files} revdep/${f}"
          fi
        done
        # The per-package sections `problems.md` and `failures.md` are
        # assembled from. `git add <dir>` stages removals as well, which is
        # what retires a package the run found fixed.
        for d in problems failures; do
          if [ -d "revdep/${d}" ]; then
            files="${files} revdep/${d}"
          fi
        done
        if [ -z "${files}" ]; then
          echo "::notice::No report files were written; nothing to commit."
          exit 0
        fi
        git add -- ${files}
        if git diff --cached --quiet; then
          echo "::notice::The report is unchanged; nothing to commit."
          exit 0
        fi
        git commit -m "${subject}" \
          -m "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
        git fetch origin "${REF}"
        git rebase "origin/${REF}"
        git push origin "HEAD:${REF}"
        echo "::notice::Report committed to ${REF}."
      shell: bash
