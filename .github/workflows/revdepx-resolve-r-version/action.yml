name: "Resolve the R version"
description: >
  Resolve the R version the shards check under, from the dispatch input or the
  runner's own R. Reports it, and exports it for the jobs that need it by name.

inputs:
  input:
    description: "The dispatched r-version, empty for the runner's own."
    required: true

outputs:
  r_version:
    description: "The resolved R version."
    value: ${{ steps.main.outputs.r_version }}

runs:
  using: "composite"
  steps:
    - name: "Resolve the R version"
      id: main
      env:
        INPUT: ${{ inputs.input }}
      run: |
        set -eu
        if printf '%s' "${INPUT}" | grep -Eq '^[0-9]+\.[0-9]+(\.[0-9]+)?$'; then
          version="${INPUT}"
        else
          version=$(curl -fsSL --retry 3 "https://api.r-hub.io/rversions/resolve/${INPUT}" | jq -r '.version')
        fi
        if ! printf '%s' "${version}" | grep -Eq '^[0-9]+\.[0-9]+(\.[0-9]+)?$'; then
          echo "::error::Could not resolve R version '${INPUT}' (got '${version}')"
          exit 1
        fi
        echo "Checks run under R ${version}"
        echo "REVDEPX_R_VERSION=${version}" >> "${GITHUB_ENV}"
        echo "r_version=${version}" >> "${GITHUB_OUTPUT}"
      shell: bash
